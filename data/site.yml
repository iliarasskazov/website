lede: >
  I build the simulation software that scientific and engineering teams make
  decisions with.

about:
  - >
    Twelve years of taking physics-based models from theory into production, split
    between academia and industry. At Tandem PV I develop a new class of bankable
    simulation software for perovskite-silicon tandem modules — models that do not
    only have to be right, they have to survive independent third-party technical due
    diligence before anyone will underwrite the technology. I process and analyse
    outdoor field data, build and calibrate the underlying physical models, and feed
    the results back into device design.
  - >
    Before that: large-scale electromagnetic simulation on HPC clusters and cloud at
    KLA, and inverse design of manufacturable low-emissivity coatings at SunDensity.
  - >
    The thread through all of it is infrastructure. I write tools that other people
    use — an open-source scattering package the community cites as working tooling,
    and a thin-film optics platform that checks published spectra against recomputed
    ones. Recent research applies deep learning to measurement inversion in infrared
    microspectroscopy: physics-informed ML as a solver for the physics, not a
    replacement for it.

software:
  - name: multilayer.app
    url: https://multilayer.app
    blurb: >
      Thin-film optics platform built on a transfer-matrix core, with a replication
      engine that recomputes spectra from published papers and scores reproduction fit
      against digitized curves — span-normalized RMSE with a maximum-deviation guard,
      plus provenance grading of every optical input.
    meta: Python, FastAPI, React, Pyodide/WASM

  - name: STRATIFY
    url: https://gitlab.com/iliarasskazov/stratify
    blurb: >
      Open-source MATLAB package for electromagnetic scattering by multilayered
      spheres. Adopted by the light-scattering community as working tooling.
    meta: OSA Continuum 3, 2290 (2020) - 58 citations

