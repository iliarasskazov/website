name: Refresh metrics

# Daily at 06:17 UTC. Off the hour on purpose: :00 is when every scheduled
# workflow on GitHub fires at once and runners queue.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml

      - name: Fetch metrics and rebuild
        run: |
          python3 bin/update-metrics.py
          python3 build.py

      - name: Commit only if something actually changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "no change — nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/site.yml docs/
          git commit -m "Refresh metrics [skip ci]"
          git push
